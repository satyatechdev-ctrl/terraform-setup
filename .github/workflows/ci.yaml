name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Run build
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build

      - name: Simulate build failure
        run: exit 1

  notify-devops-agent:
    name: Notify DevOps Agent
    runs-on: ubuntu-latest
    needs: build
    if: ${{ failure() }}
    steps:
      - name: Trigger Investigation
        env:
          WEBHOOK_URL: ${{ secrets.DEVOPS_AGENT_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEVOPS_AGENT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export TIMESTAMP
          export INCIDENT_ID="gha-${{ github.run_id }}"
          export WORKFLOW_NAME="${{ github.workflow }}"
          export REF_NAME="${{ github.ref_name }}"
          export RUN_NUMBER="${{ github.run_number }}"
          export COMMIT_SHA="${{ github.sha }}"
          export RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          export REPOSITORY="${{ github.repository }}"
          export RUN_ID="${{ github.run_id }}"

          PAYLOAD=$(jq -cn \
            --arg eventType "incident" \
            --arg incidentId "${INCIDENT_ID}" \
            --arg action "created" \
            --arg priority "HIGH" \
            --arg title "CI/CD Pipeline Failed: ${WORKFLOW_NAME}" \
            --arg description "Workflow ${WORKFLOW_NAME} failed on branch ${REF_NAME} (run #${RUN_NUMBER}). Commit: ${COMMIT_SHA}. See: ${RUN_URL}" \
            --arg timestamp "${TIMESTAMP}" \
            --arg service "my-service" \
            --arg repository "${REPOSITORY}" \
            --arg run_id "${RUN_ID}" \
            --arg run_url "${RUN_URL}" \
            --arg branch "${REF_NAME}" \
            --arg commit_sha "${COMMIT_SHA}" \
            '{eventType:$eventType,incidentId:$incidentId,action:$action,priority:$priority,title:$title,description:$description,timestamp:$timestamp,service:$service,data:{repository:$repository,run_id:$run_id,run_url:$run_url,branch:$branch,commit_sha:$commit_sha}}')
          echo "${PAYLOAD}" | jq empty

          SIGNATURE=$(printf '%s' "${TIMESTAMP}:${PAYLOAD}" | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" -binary | base64)

          curl --fail-with-body --silent --show-error --request POST "${WEBHOOK_URL}" \
            --header "Content-Type: application/json" \
            --header "x-amzn-event-timestamp: ${TIMESTAMP}" \
            --header "x-amzn-event-signature: ${SIGNATURE}" \
            --data "${PAYLOAD}"
